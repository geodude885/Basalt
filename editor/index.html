<title>Boss Battles Chart Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a workbench - lane seen from above on the left, the chart's timeline across the right,
   settings in tabs under the timeline. One committed dark look: a slate arena floor at night with
   the lane's own orange as the accent. */
:root {
  --ground: #15181c;      /* page */
  --slab: #1d2127;        /* panels */
  --slab-2: #262b33;      /* raised controls */
  --line: #343a44;        /* hairlines */
  --sand: #e9dcc4;        /* text */
  --dust: #9a9184;        /* secondary text */
  --lane: #ff7a1a;        /* accent: the lane lines */
  --lane-soft: #ff7a1a33;
  --telegraph: #ffd166;   /* a projectile waiting */
  --move: #6fb7ff;        /* actor moves */
  --take: #b38cff;        /* recorded takes */
  --phase: #4fd1a5;       /* phases */
  --bad: #ff5a5a;
  --good: #4fd1a5;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ground); color: var(--sand); font: 14px/1.45 var(--body); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button {
  background: var(--slab-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px;
  cursor: pointer; white-space: nowrap;
}
button:hover { border-color: var(--dust); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--lane); outline-offset: 1px; }
button.primary { background: var(--lane); color: #1b1006; border-color: var(--lane); font-weight: 600; }
button.on { border-color: var(--lane); color: var(--lane); }
button:disabled { opacity: .45; cursor: default; }
input, select, textarea { background: var(--ground); border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; min-width: 0; }
input[type=number] { font-family: var(--mono); font-variant-numeric: tabular-nums; }
label { display: grid; gap: 2px; font-size: 12px; color: var(--dust); min-width: 0; }
label > span { letter-spacing: .04em; text-transform: uppercase; font-size: 11px; }
label.check { display: flex; align-items: center; gap: 8px; margin: 6px 0; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; padding-inline: 16px; }
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 10px;
  border-bottom: 1px solid var(--line);
}
.brand { font: 700 22px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; }
.brand b { color: var(--lane); }
.bar .group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.bar .spacer { flex: 1; }
.chartname { font: 600 18px/1.1 var(--display); color: var(--sand); max-width: 22ch; overflow: hidden; text-overflow: ellipsis; }
.status { font-size: 12px; color: var(--dust); }
.chip { font: 500 12px var(--mono); padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer; background: none; }
.chip.ok { color: var(--good); border-color: #4fd1a555; }
.chip.bad { color: var(--bad); border-color: #ff5a5a66; }

.work { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 16px; padding-block: 12px; min-height: 0; }
.pane { background: var(--slab); border: 1px solid var(--line); border-radius: 10px; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.pane h2 { margin: 0; font: 700 15px/1 var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--dust); padding: 10px 12px 6px; }
.lanepane { overflow: auto; }
#lane { width: 100%; aspect-ratio: 3 / 4; display: block; touch-action: none; cursor: crosshair; }
.inspector { padding: 10px 12px 14px; display: grid; gap: 10px; border-top: 1px solid var(--line); }
.inspector .empty { color: var(--dust); font-size: 13px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.kind { font: 700 18px/1 var(--display); text-transform: uppercase; letter-spacing: .04em; }

.timepane { display: grid; grid-template-rows: auto auto minmax(0, 1fr); }
.transport { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.clock { font: 500 20px/1 var(--mono); font-variant-numeric: tabular-nums; min-width: 9ch; }
.clock small { font-size: 12px; color: var(--dust); margin-left: 6px; }
.transport select { padding: 3px 4px; }
.tlwrap { position: relative; border-bottom: 1px solid var(--line); }
#timeline { width: 100%; height: 230px; display: block; touch-action: none; }
.tabs { display: flex; flex-direction: column; min-height: 0; }
.tabbar { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--line); }
.tabbar button { border: 0; border-radius: 6px 6px 0 0; background: none; color: var(--dust); padding: 6px 12px; font: 600 14px var(--display); letter-spacing: .06em; text-transform: uppercase; }
.tabbar button[aria-selected=true] { background: var(--slab-2); color: var(--sand); }
.panel { padding: 12px; overflow: auto; display: grid; gap: 12px; align-content: start; }
.panel h3 { margin: 4px 0 0; font: 700 14px var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--dust); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.list { display: grid; gap: 6px; }
.list .item { display: flex; flex-wrap: wrap; gap: 6px; align-items: end; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--ground); }
.list .item label { flex: 1 1 90px; }
.problems { display: grid; gap: 4px; font: 13px var(--mono); }
.problems div { padding: 4px 8px; border-left: 3px solid var(--bad); background: #ff5a5a14; }
.problems .none { border-left-color: var(--good); background: #4fd1a514; }
.stat { display: grid; gap: 2px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
.stat b { font: 600 20px var(--mono); font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--dust); text-transform: uppercase; letter-spacing: .05em; }
.keys { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 13px; }
.keys kbd { font: 12px var(--mono); padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--ground); }
.note { color: var(--dust); font-size: 13px; max-width: 70ch; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--slab-2); border: 1px solid var(--lane); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 5; max-width: calc(100% - 32px); }
.drop { position: fixed; inset: 0; background: #ff7a1a22; border: 3px dashed var(--lane); display: none; place-items: center; font: 700 28px var(--display); text-transform: uppercase; z-index: 4; pointer-events: none; }
.drop.show { display: grid; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--lane); border-radius: 8px; background: var(--lane-soft); }

@media (max-width: 860px) {
  .work { grid-template-columns: minmax(0, 1fr); }
  #lane { aspect-ratio: 4 / 3; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div class="app">
  <header class="bar">
    <div class="brand">Boss <b>Battles</b> Charts</div>
    <div class="chartname" id="chartName">-</div>
    <div class="group">
      <button id="btnNew" title="Start a new chart from the template">New</button>
      <button id="btnOpen" title="Open chart.json, its song, cover and clips - or a .bbchart">Open files…</button>
      <button id="btnOpenFolder" hidden title="Open a chart folder to edit it in place">Open folder…</button>
      <button id="btnSaveFolder" hidden class="primary" title="Write chart.json back into the folder">Save to folder</button>
      <button id="btnCopy" class="primary" title="Copy chart.json - paste it over your chart's file; the game reloads it">Copy chart.json</button>
      <button id="btnDownload" title="Download chart.json">chart.json ↓</button>
      <button id="btnPackage" title="Download a package (.bbchart) with the song, cover and clips - drop it into the game's Charts folder">Package ↓</button>
    </div>
    <div class="spacer"></div>
    <div class="group">
      <button id="btnUndo" title="Undo (Ctrl+Z)">Undo</button>
      <button id="btnRedo" title="Redo (Ctrl+Y)">Redo</button>
      <button class="chip ok" id="problemChip">no problems</button>
    </div>
  </header>

  <main class="work">
    <section class="pane lanepane" aria-label="Lane">
      <h2>Lane from above</h2>
      <canvas id="lane" aria-label="The lane from above: you at the bottom, the actor at the top"></canvas>
      <div class="inspector" id="inspector"></div>
    </section>

    <section class="pane timepane" aria-label="Timeline">
      <div class="transport">
        <button id="btnPlay" class="primary" title="Play / pause (Space)">Play</button>
        <button id="btnStartOver" title="Back to the start (Home)">⏮</button>
        <div class="clock" id="clock">0:00.000<small>beat -</small></div>
        <label><span>Speed</span><select id="rate"><option value="1">100%</option><option value="0.75">75%</option><option value="0.5">50%</option><option value="0.25">25%</option></select></label>
        <label><span>Snap</span><select id="snap"><option value="1">1 beat</option><option value="0.5" selected>1/2</option><option value="0.25">1/4</option><option value="0.125">1/8</option><option value="0">off</option></select></label>
        <button id="btnClick" title="A click on every beat while playing">Click</button>
        <label><span>Volume</span><input id="volume" type="range" min="0" max="1" step="0.05" value="0.5" title="How loud the editor plays - the song and the click. Not saved in the chart."></label>
        <button id="btnZoomOut" title="Zoom out ( [ )">−</button>
        <button id="btnZoomIn" title="Zoom in ( ] )">+</button>
        <div class="row">
          <button id="btnAddShot" title="Add a projectile at the playhead (P)">+ Projectile</button>
          <button id="btnAddMove" title="Add a move at the playhead (M)">+ Move</button>
          <button id="btnAddPhase" title="Start a phase at the playhead">+ Phase</button>
        </div>
      </div>
      <div class="tlwrap"><canvas id="timeline" aria-label="Timeline: song waveform, beats, phases, projectiles, moves and recorded takes"></canvas></div>
      <div class="tabs">
        <div class="tabbar" role="tablist">
          <button role="tab" data-tab="chart" aria-selected="true">Chart</button>
          <button role="tab" data-tab="tempo">Tempo</button>
          <button role="tab" data-tab="actors">Actors</button>
          <button role="tab" data-tab="problems">Problems</button>
          <button role="tab" data-tab="help">Keys &amp; help</button>
        </div>
        <div class="panel" id="panel"></div>
      </div>
    </section>
  </main>
</div>
<input type="file" id="fileInput" multiple hidden accept=".json,.bbchart,.zip,.wav,.ogg,.mp3,.png,.jpg,.jpeg">
<div class="drop" id="drop">Drop chart files</div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";

// ---- Sample: what the editor opens on, so it shows what it does ----------------------------------
const SAMPLE = `{
  "format": 1,
  "name": "Crossfire",
  "author": "BossBattles",
  "difficulty": "Normal",
  "description": "Shots cutting across the lane. Hits on the Gunner count double while it is open.",
  // No spot: the lane is laid across the Pit through its centre.
  "arena": { "map": "pit" },
  "bpm": 120,
  "lane": { "length": 12, "width": 3 },
  "actors": [ { "id": "gunner", "name": "The Gunner", "at": { "x": 0, "z": 12 } } ],
  "phases": [
    { "name": "Angles", "start": 0 },
    { "name": "Open", "start": 18, "scoreMultiplier": 2, "at": { "x": 1.2, "z": 10 } },
    { "name": "Storm", "start": 26 }
  ],
  "events": [
    { "t": 2,    "projectile": { "structure": "Disc", "from": { "x": -1.5, "y": 1.4, "z": 10 }, "to": { "x": 1.2,  "y": 1.3 }, "speed": 11, "telegraph": 0.8, "by": "gunner" } },
    { "t": 3.5,  "projectile": { "structure": "Disc", "from": { "x": 1.5,  "y": 1.4, "z": 10 }, "to": { "x": -1.2, "y": 1.3 }, "speed": 11, "telegraph": 0.8, "by": "gunner" } },
    { "t": 5,    "projectile": { "structure": "Disc", "from": { "x": 0,    "y": 1.5, "z": 11 }, "to": "player", "speed": 12, "telegraph": 0.7, "by": "gunner" } },
    { "t": 7,    "projectile": { "structure": "Ball", "from": { "x": -1.2, "y": 1.0, "z": 9 },  "to": { "x": 0.8,  "y": 1.0 }, "speed": 9, "telegraph": 0.8, "by": "gunner" } },
    { "t": 7.4,  "projectile": { "structure": "Ball", "from": { "x": 1.2,  "y": 1.0, "z": 9 },  "to": { "x": -0.8, "y": 1.0 }, "speed": 9, "telegraph": 0.8, "by": "gunner" } },
    { "t": 10,   "at": { "x": -1.2, "z": 11 } },
    { "t": 11,   "projectile": { "structure": "Disc", "from": { "x": -1.2, "y": 1.4, "z": 10 }, "to": "player", "speed": 13, "telegraph": 0.6, "by": "gunner" } },
    { "t": 12,   "projectile": { "structure": "Disc", "from": { "x": -1.2, "y": 1.4, "z": 10 }, "to": { "x": 1.0, "y": 1.4 }, "speed": 13, "telegraph": 0.6, "by": "gunner" } },
    { "t": 14,   "move": "Straight" },
    { "t": 20,   "projectile": { "structure": "Disc", "from": { "x": 1.2,  "y": 1.4, "z": 9 },  "to": "player", "speed": 10, "telegraph": 0.8, "by": "gunner" } },
    { "t": 27,   "projectile": { "structure": "Disc", "from": { "x": -1.5, "y": 1.2, "z": 10 }, "to": "player", "speed": 14, "telegraph": 0.5 } },
    { "t": 27.5, "projectile": { "structure": "Disc", "from": { "x": 1.5,  "y": 1.6, "z": 10 }, "to": "player", "speed": 14, "telegraph": 0.5 } },
    { "t": 28,   "projectile": { "structure": "Disc", "from": { "x": 0,    "y": 1.0, "z": 10 }, "to": "player", "speed": 14, "telegraph": 0.5 } },
    { "t": 28.5, "projectile": { "structure": "Disc", "from": { "x": 0,    "y": 1.9, "z": 10 }, "to": "player", "speed": 14, "telegraph": 0.5 } }
  ],
  "end": 33
}
`;

const TEMPLATE = (name, author) => `{
  // Made in the Boss Battles chart editor. The full format: docs/chart-format.md in the mod's repository.
  "format": 1,
  "name": ${JSON.stringify(name)},
  "author": ${JSON.stringify(author || "you")},
  "difficulty": "Easy",
  "description": "",
  "arena": { "map": "here" },
  "bpm": 120,
  "lane": { "length": 12, "width": 3 },
  "actors": [ { "id": "boss", "name": "Boss", "at": { "x": 0, "z": 12 }, "look": "you" } ],
  "events": [],
  "end": 16
}
`;

const STRUCTURES = ["Disc", "Ball", "Pillar", "Wall", "RockCube", "BoulderBall", "SmallRock", "LargeRock"];
const MOVES = ["Straight", "Uppercut", "Kick", "Stomp", "Explode", "Flick", "Parry", "Jump", "RockSlide", "Disc", "SpawnBall", "SpawnCube", "SpawnPillar", "SpawnWall", "HoldLeft", "HoldRight"];
const MAPS = ["here", "gym", "ring", "pit"];
const PLAYER_HEAD = 1.35; // where "player" aims, roughly: your chest at your end
// Structures the game spawns on the ground: they rest on the floor wherever the chart says, so their height is ignored.
/**
 * Each structure's size in metres as the game has it - across the lane, along it and up - posed as a
 * projectile is, looking down the lane at you. Measured in game (--bossbattles-selftest=measure).
 */
const SIZES = {
  Disc: { across: 0.86, along: 0.84, up: 0.2 }, Ball: { across: 0.84, along: 0.75, up: 0.77 },
  Pillar: { across: 0.5, along: 0.5, up: 1.95 }, Wall: { across: 1.3, along: 0.6, up: 2.15 },
  RockCube: { across: 1, along: 1, up: 1 }, BoulderBall: { across: 0.94, along: 0.85, up: 0.87 },
  SmallRock: { across: 1.02, along: 0.64, up: 0.98 }, LargeRock: { across: 2.35, along: 2.37, up: 1.61 },
};
/** Structures that come up out of the floor and rest on it, whatever height a chart gives. */
const GROUNDED = ["Disc", "RockCube", "Pillar", "Wall"];
/** The ones the game spawns in its grounded state - thrown along the floor unless a chart says "grounded": false. */
const GROUNDED_STATE = ["RockCube", "Pillar", "Wall"];
/** Thrown grounded: in the game's grounded state (more damage), along the floor. */
const isGrounded = s => s.grounded ?? GROUNDED_STATE.includes(s.structure);
/** Sits on the floor: grounded, or a structure that always rises out of it. */
const onFloor = s => isGrounded(s) || GROUNDED.includes(s.structure);
/** The game's shiftstones, as the mod reads them from its pools. */
const STONES = ["Adamant", "Charge", "Flow", "Guard", "Stubborn", "Surge", "Vigor", "Volatile"];
/** The looks with names; anything else is a character string kept from the game. */
const LOOKS = [["you", "whoever plays"], ["default", "default"], ["defaultMale", "default male"], ["defaultFemale", "default female"]];
const stoneName = s => (s || "").replace(/\s*stone$/i, "");
/** An actor's look and stones, as the actors tab shows them. */
function actorLookHtml(a, i) {
  const look = a.look ?? "you", kept = !LOOKS.some(([v]) => v.toLowerCase() === look.toLowerCase());
  const stones = Array.isArray(a.shiftstones) ? a.shiftstones.map(stoneName) : null;
  const slot = n => `<select data-actor="${i}" data-field="stone${n}" ${n === 1 && !stones ? "disabled" : ""}>
      ${n === 0 ? `<option value="you" ${stones ? "" : "selected"}>whoever plays's</option>` : ""}
      <option value="" ${stones && !stones[n] ? "selected" : ""}>none</option>
      ${STONES.map(s => `<option ${stones && stones[n] && stones[n].toLowerCase() === s.toLowerCase() ? "selected" : ""}>${s}</option>`).join("")}</select>`;
  return `<label><span>Look</span><select data-actor="${i}" data-field="look">
      ${kept ? `<option value="${esc(look)}" selected>as made in game</option>` : ""}
      ${LOOKS.map(([v, t]) => `<option value="${v}" ${!kept && v.toLowerCase() === look.toLowerCase() ? "selected" : ""}>${t}</option>`).join("")}</select></label>
    <label><span>Paste a look</span><input data-actor="${i}" data-field="lookPaste" placeholder="a look from another chart"></label>
    <label><span>Shiftstones</span>${slot(0)}</label><label><span>&nbsp;</span>${slot(1)}</label>`;
}
/** The lane's parts a chart can colour, with the mod's own colours (LaneVisuals.cs). */
const LANE_COLOURS = [["edges", "Edge lines", "#ff7319"], ["ends", "End lines", "#ffd933"], ["zone", "Zone line", "#f2f2d9"], ["backstop", "Backstop frame", "#ff7319"]];
const colours = () => S.chart.colours || S.chart.colors || {};
/** Opacity of a "#RRGGBBAA" colour, 0 to 1 (1 without alpha). */
const alphaOf = hex => hex && hex.length === 9 ? parseInt(hex.slice(7), 16) / 255 : 1;
/** A colour input's value with an opacity, as "#RRGGBBAA". */
const withAlpha = (hex, a) => hex.slice(0, 7) + Math.round(Math.min(1, Math.max(0, a)) * 255).toString(16).padStart(2, "0");
/** A phase's own lane colours, as the phase panel shows them. */
function phaseColoursHtml(phase) {
  const own = phase.colours || phase.colors || {}, walls = own.walls, mode = walls == null ? "chart" : walls === "none" ? "hide" : "show";
  return `<h3>Lane colours from this phase</h3><div class="grid2">
    ${LANE_COLOURS.map(([key, label, mine]) => `<label><span><input type="checkbox" data-pcolour-on="${key}" ${own[key] ? "checked" : ""}> ${label}</span><input type="color" data-pcolour="${key}" value="${(own[key] || colours()[key] || mine).slice(0, 7)}" ${own[key] ? "" : "disabled"}></label>`).join("")}
    </div><div class="grid3">
      <label><span>Walls</span><select id="pw_mode">${[["chart", "as the chart"], ["show", "shown"], ["hide", "hidden"]].map(([v, t]) => `<option value="${v}" ${mode === v ? "selected" : ""}>${t}</option>`).join("")}</select></label>
      <label><span>Wall colour</span><input type="color" id="pw_colour" value="${(mode === "show" ? walls : colours().walls || "#66ccff").slice(0, 7)}" ${mode === "show" ? "" : "disabled"}></label>
      <label><span>Wall opacity</span><input type="range" id="pw_alpha" min="0.05" max="0.8" step="0.05" value="${alphaOf(mode === "show" ? walls : colours().walls || "#66ccff33")}" ${mode === "show" ? "" : "disabled"}></label>
    </div><div class="note">Ticked colours replace the chart's from this phase on; the lane fades to them over a second.</div>`;
}
/** Reads the phase panel's colour inputs back into a phase's "colours". */
function readPhaseColours() {
  const panel = $("panel"), next = {};
  LANE_COLOURS.forEach(([key]) => { if (panel.querySelector(`[data-pcolour-on="${key}"]`).checked) next[key] = panel.querySelector(`[data-pcolour="${key}"]`).value; });
  const mode = $("pw_mode").value;
  if (mode === "hide") next.walls = "none";
  else if (mode === "show") next.walls = withAlpha($("pw_colour").value, parseFloat($("pw_alpha").value) || 0.2);
  return next;
}

// ---- JSON with comments: read it, and edit one top-level value in place --------------------------
const Jsonc = {
  // JSON with line and block comments and trailing commas, as the mod reads it.
  parse(text) {
    let out = "", i = 0;
    while (i < text.length) {
      const c = text[i];
      if (c === '"') { const e = Jsonc.stringEnd(text, i); out += text.slice(i, e); i = e; }
      else if (text.startsWith("//", i)) { const e = text.indexOf("\n", i); i = e < 0 ? text.length : e; }
      else if (text.startsWith("/*", i)) { const e = text.indexOf("*/", i + 2); i = e < 0 ? text.length : e + 2; }
      else { out += c; i++; }
    }
    return JSON.parse(out.replace(/,(\s*[}\]])/g, "$1"));
  },
  stringEnd(text, at) {
    for (let i = at + 1; i < text.length; i++) {
      if (text[i] === "\\") i++;
      else if (text[i] === '"') return i + 1;
    }
    throw new Error("a string never ends");
  },
  skip(text, at) {
    while (at < text.length) {
      if (/\s/.test(text[at])) at++;
      else if (text.startsWith("//", at)) { const e = text.indexOf("\n", at); at = e < 0 ? text.length : e + 1; }

    }

  },
  valueEnd(text, at) {

      let e = at;
      while (e < text.length && !/[\s,}\]]/.test(text[e]) && !text.startsWith("//", e) && !text.startsWith("/*", e)) e++;
      return e;
    }
    let depth = 0;
    for (let i = at; i < text.length; i++) {
      const d = text[i];
      if (d === '"') i = Jsonc.stringEnd(text, i) - 1;
      else if (text.startsWith("//", i)) { const e = text.indexOf("\n", i); i = (e < 0 ? text.length : e + 1) - 1; }
      else if (text.startsWith("/*", i)) { const e = text.indexOf("*/", i + 2); i = (e < 0 ? text.length : e + 2) - 1; }
      else if (d === "{" || d === "[") depth++;

    }
    throw new Error("a value is never closed");
  },
  /** The text with top-level `name` set to `value` - the same edit the mod makes, so comments elsewhere survive. */
  set(text, name, value) {
    const json = Jsonc.pretty(value, "  ");
    const open = Jsonc.skip(text, 0);
    if (text[open] !== "{") throw new Error("a chart is a JSON object");
    let at = open + 1, lastEnd = -1;
    for (;;) {
      at = Jsonc.skip(text, at);

        if (lastEnd < 0) return text.slice(0, open + 1) + property + "\n" + text.slice(at);
        const after = Jsonc.skip(text, lastEnd);
        const comma = after < at && text[after] === ",";
        const insert = comma ? after + 1 : lastEnd;
        return text.slice(0, insert) + (comma ? "" : ",") + text.slice(insert, at).trimEnd() + property + "\n" + text.slice(at);
      }
      if (c === ",") { at++; continue; }
      if (c !== '"') throw new Error("expected a property name");

      if (value.length === 0) return "[]";
      return "[\n" + value.map(v => indent + "  " + Jsonc.pretty(v, indent + "  ")).join(",\n") + "\n" + indent + "]";
    }
    const entries = Object.entries(value).map(([k, v]) => `${indent}  ${JSON.stringify(k)}: ${Jsonc.pretty(v, indent + "  ")}`);
    return "{\n" + entries.join(",\n") + "\n" + indent + "}";
  },
};

// ---- Tempo: one bpm or a list of changes ------------------------------------------------------
class Tempo {
  constructor(bpm) {
    this.changes = Array.isArray(bpm) ? bpm.filter(c => c && c.bpm > 0).map(c => ({ beat: +c.beat || 0, bpm: +c.bpm })) : (bpm > 0 ? [{ beat: 0, bpm: +bpm }] : []);
    this.changes.sort((a, b) => a.beat - b.beat);
    if (this.changes.length && this.changes[0].beat !== 0) this.changes.unshift({ beat: 0, bpm: this.changes[0].bpm });
    this.starts = [];
    let s = 0;
    this.changes.forEach((c, i) => { if (i > 0) s += (c.beat - this.changes[i - 1].beat) * 60 / this.changes[i - 1].bpm; this.starts.push(s); });
  }
  get ok() { return this.changes.length > 0; }
  seconds(beat) {
    let i = this.changes.length - 1;
    while (i > 0 && this.changes[i].beat > beat) i--;
    return this.starts[i] + (beat - this.changes[i].beat) * 60 / this.changes[i].bpm;
  }
  beat(seconds) {
    let i = this.starts.length - 1;
    while (i > 0 && this.starts[i] > seconds) i--;
    return this.changes[i].beat + (seconds - this.starts[i]) * this.changes[i].bpm / 60;
  }
  bpmAt(seconds) {
    let i = this.starts.length - 1;
    while (i > 0 && this.starts[i] > seconds) i--;
    return this.changes[i].bpm;
  }
}

// ---- State --------------------------------------------------------------------------------------
const S = {
  text: SAMPLE,          // the chart as written - edits go into it in place
  chart: null,           // parsed
  sourceName: "chart.json",
  files: new Map(),      // other files beside the chart: song, cover, clips/*.json - path -> Uint8Array
  clips: new Map(),      // clip name -> { start, end } for drawing takes
  song: null,            // { name, url, buffer }
  cover: null,           // object URL
  folder: null,          // a directory handle, when opened as a folder
  selection: new Set(),  // indices into chart.events
  selectedPhase: -1,
  undo: [], redo: [],
  time: 0, playing: false, playStartedAt: 0, playStartTime: 0,
  view: { t0: -1, pps: 60 },
  rate: 1, snap: 0.5, click: false, lastClickBeat: -1,
  volume: 0.5,           // how loud the editor plays: the song (times the chart's own volume) and the click
  tab: "chart", tapTimes: [], confirmNew: false,

const $ = id => document.getElementById(id);
const audio = new Audio();
audio.preservesPitch = true;
let audioContext = null;

function load(text, name) {

  chart.events ??= [];
  S.text = text; S.chart = chart; S.sourceName = name || "chart.json";
  S.selection.clear(); S.selectedPhase = -1; S.undo = []; S.redo = [];
  S.time = 0; S.view.t0 = -1;

const tempo = () => new Tempo(S.chart.bpm);
const lane = () => ({ length: +(S.chart.lane?.length ?? 12), width: +(S.chart.lane?.width ?? 3) });
const actors = () => Array.isArray(S.chart.actors) && S.chart.actors.length ? S.chart.actors : [{ id: "actor", name: "Actor", at: { x: 0, z: lane().length } }];
/** Your zone: how far down the lane you may go and how high - 2 m short of the far end and 3.5 m without one. */
const zone = () => {
  const L = lane(), z = S.chart.zone || {};
  return { length: +(z.length ?? (L.length > 4 ? L.length - 2 : L.length / 2)), height: +(z.height ?? 3.5) };
};
/** How long the song runs in chart time (from the chart's start into the song), or null with no song open. */
const songLength = () => S.song?.buffer ? S.song.buffer.duration - (+S.chart.music?.start || 0) : null;
const end = () => S.chart.end ?? (Math.max(0, ...S.chart.events.map(evTime).filter(Number.isFinite)) + 3);

function evTime(ev) {

  const tp = tempo();

}
function setEvTime(ev, seconds) {

  else ev.t = round(seconds, 3);
}

}
const round = (v, d) => Math.round(v * 10 ** d) / 10 ** d;
const kindOf = ev => ev.projectile ? "projectile" : ev.move != null ? "move" : ev.clip != null ? "clip" : ev.at ? "at" : "?";

/** Records the chart before a change, for undo; the change then writes the edited keys back into the text. */
function change(keys, mutate) {
  S.undo.push({ text: S.text });

  S.redo = [];

// ---- Validation: the mod's own checks that a chart maker hits most ---------------------------
function problems() {
  const out = [], c = S.chart, L = lane(), tp = tempo();
  const ids = new Set(actors().map(a => a.id));
  if (c.format > 2) out.push(`format ${c.format} is newer than the mod reads (2)`);
  if (L.length <= 2) out.push("lane.length must be over 2 m");
  if (L.width <= 0) out.push("lane.width must be over 0");
  if (c.bpm != null && !tp.ok) out.push("bpm must be a number over 0, or tempo changes");
  if (Array.isArray(c.bpm)) c.bpm.forEach((b, i) => { if (i === 0 && b.beat !== 0) out.push("bpm[0].beat must be 0"); if (i > 0 && b.beat <= c.bpm[i - 1].beat) out.push(`bpm[${i}].beat must be after the change before it`); });
  actors().forEach((a, i) => { if (a.at && !(a.at.z >= 0 && a.at.z <= L.length)) out.push(`actors[${i}].at.z (${a.at.z}) must be within the lane: 0 to ${L.length}`); });
  (c.phases || []).forEach((p, i) => {
    if (i === 0 && phaseTime(p) !== 0) out.push("phases[0] must start at 0");
    if (i > 0 && phaseTime(p) <= phaseTime(c.phases[i - 1])) out.push(`phases[${i}] must start after phases[${i - 1}]`);
  });
  c.events.forEach((e, i) => {
    const p = `events[${i}]`, t = evTime(e);
    const kinds = ["projectile", "move", "clip", "at"].filter(k => e[k] != null).length;
    if (kinds !== 1) out.push(`${p} needs exactly one of projectile, move, clip or at`);
    if (!Number.isFinite(t)) out.push(`${p} needs a time (t, or beat with a bpm)`);
    if (e.actor != null && !ids.has(e.actor)) out.push(`${p}.actor "${e.actor}" is not one of the actors`);
    const s = e.projectile;
    if (s) {
      if (!STRUCTURES.includes(s.structure)) out.push(`${p}.projectile.structure "${s.structure}" is not a structure`);
      const f = s.from || {};
      // Shots may start outside the lane - past the far end or off the sides - up to 6 m (ChartLoader.ProjectileReach).
      if (!(f.z > 0 && f.z <= L.length + 6)) out.push(`${p}.projectile.from.z must be over 0 and up to ${L.length + 6} (the lane, or 6 m past it)`);
      if (Math.abs(f.x || 0) > L.width / 2 + 6) out.push(`${p}.projectile.from.x must be within 6 m of the lane's sides`);
      if (f.y < 0) out.push(`${p}.projectile.from.y is below the floor`);
      if (!(s.speed > 0)) out.push(`${p}.projectile.speed must be over 0`);
      const tel = s.telegraph ?? 0.5;
      if (tel < 0) out.push(`${p}.projectile.telegraph cannot be negative`);
      else if (t - tel < 0) out.push(`${p} would appear before the battle starts`);
      if (s.grounded != null && typeof s.grounded !== "boolean") out.push(`${p}.projectile.grounded must be true or false`);
      if (s.by != null && !ids.has(s.by)) out.push(`${p}.projectile.by "${s.by}" is not one of the actors`);
    }
    if (e.at && !(e.at.z >= 0 && e.at.z <= L.length)) out.push(`${p}.at.z must be within the lane`);
  });
  const last = Math.max(0, ...c.events.map(evTime).filter(Number.isFinite));
  if (c.end != null && c.end < last) out.push(`end (${c.end}) is before the last event (${round(last, 2)})`);
  if (c.tracks?.length && (c.format ?? 1) < 2) out.push('tracks need "format": 2');
  if (c.zone?.length != null && !(c.zone.length > 0 && c.zone.length <= L.length)) out.push(`zone.length must be over 0 and up to the lane's length (${L.length})`);
  if (c.zone?.height != null && c.zone.height < 1) out.push("zone.height must be at least 1 m");
  if (c.rules?.spawn != null && !["all", "discs", "none"].includes(String(c.rules.spawn).toLowerCase())) out.push("rules.spawn must be all, discs or none");
  if (c.music?.file && !/\.(wav|ogg|mp3)$/i.test(c.music.file)) out.push("music.file must be .wav, .ogg or .mp3");
  return out;
}

/** Projectiles a second, overall and at the busiest two seconds - a rough difficulty. */
function density() {
  const shots = S.chart.events.filter(e => e.projectile).map(evTime).filter(Number.isFinite).sort((a, b) => a - b);
  const length = Math.max(1, end());
  let peak = 0;
  for (let i = 0, j = 0; i < shots.length; i++) { while (shots[i] - shots[j] > 2) j++; peak = Math.max(peak, (i - j + 1) / 2); }
  return { shots: shots.length, average: shots.length / length, peak, moves: S.chart.events.filter(e => e.move != null).length };
}

// ---- Lane canvas -------------------------------------------------------------------------------
const laneCanvas = $("lane"), lctx = laneCanvas.getContext("2d");
let laneMap = null, laneDrag = null;

function sizeCanvas(canvas) {
  const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  return { w: r.width, h: r.height, dpr };
}
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function drawLane() {
  const { w, h, dpr } = sizeCanvas(laneCanvas);
  const ctx = lctx; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  const L = lane(), margin = 26;
  const scale = Math.min((w - margin * 2) / (L.width + 3), (h - margin * 2) / (L.length + 2));
  const cx = w / 2, bottom = h - margin - scale * 0.9;
  laneMap = {
    toPx: (x, z) => [cx + x * scale, bottom - z * scale],
    toLane: (px, py) => [(px - cx) / scale, (bottom - py) / scale],
    scale,
  };
  const P = laneMap.toPx;

  // Floor, lane, ends, backstop.
  ctx.fillStyle = "#1a1e23"; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = "#2a2622";
  const [lx0, lz0] = P(-L.width / 2, L.length), [lx1, lz1] = P(L.width / 2, 0);
  ctx.fillRect(lx0, lz0, lx1 - lx0, lz1 - lz0);
  ctx.strokeStyle = css("--lane"); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(lx0, lz0); ctx.lineTo(lx0, lz1); ctx.moveTo(lx1, lz0); ctx.lineTo(lx1, lz1); ctx.stroke();
  ctx.strokeStyle = "#ffd36a"; ctx.beginPath(); ctx.moveTo(lx0, lz1); ctx.lineTo(lx1, lz1); ctx.moveTo(lx0, lz0); ctx.lineTo(lx1, lz0); ctx.stroke();
  ctx.strokeStyle = "#ff7a1a66"; ctx.setLineDash([4, 4]);
  const [bx0, bz] = P(-L.width / 2 - 1, -0.9), [bx1] = P(L.width / 2 + 1, -0.9);
  ctx.beginPath(); ctx.moveTo(bx0, bz); ctx.lineTo(bx1, bz); ctx.stroke(); ctx.setLineDash([]);
  // Your zone: where you may go, and the line you stop at.
  const Z = zone();
  if (Z.length < L.length) {
    const [zx0, zy] = P(-L.width / 2, Z.length), [zx1] = P(L.width / 2, Z.length);
    ctx.fillStyle = "#ffffff0d"; ctx.fillRect(zx0, zy, zx1 - zx0, lz1 - zy);
    ctx.strokeStyle = "#f2f2d9"; ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(zx0, zy); ctx.lineTo(zx1, zy); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "#f2f2d9"; ctx.font = `10px ${css("--mono")}`; ctx.textAlign = "left";
    ctx.fillText(`your zone · ${Z.height} m high`, zx1 + 4, zy + 3);
  }
  // Metre ticks along the left edge.
  ctx.fillStyle = css("--dust"); ctx.font = `10px ${css("--mono")}`; ctx.textAlign = "right";
  for (let z = 0; z <= L.length; z += 2) { const [x, y] = P(-L.width / 2, z); ctx.fillText(`${z}m`, x - 5, y + 3); }

  // You, and the actors where they stand at the playhead.
  const [yx, yy] = P(0, 0);
  ctx.fillStyle = css("--sand"); ctx.beginPath(); ctx.arc(yx, yy, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = css("--dust"); ctx.textAlign = "center"; ctx.fillText("you", yx, yy + 20);

    const at = actorSpotAt(a, S.time);
    const [ax, ay] = P(at.x, at.z);
    ctx.fillStyle = css("--move"); ctx.beginPath(); ctx.arc(ax, ay, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = css("--sand"); ctx.font = `600 11px ${css("--body")}`; ctx.fillText(a.name || a.id, ax, ay - 13);

  const t = S.time;
  S.chart.events.forEach((e, i) => {
    const s = e.projectile; if (!s || !s.from) return;
    const launch = evTime(e), spawn = launch - (s.telegraph ?? 0.5);
    const selected = S.selection.has(i);
    const [fx, fy] = P(+s.from.x || 0, +s.from.z || 0);
    const aim = s.to === "player" || s.to == null ? { x: 0, y: PLAYER_HEAD } : s.to;
    const [tx, ty] = P(+aim.x || 0, 0);
    const flight = Math.hypot((aim.x || 0) - (s.from.x || 0), (aim.y ?? 1.3) - (s.from.y || 0), s.from.z || 0) / Math.max(0.1, s.speed || 1);

    if (selected) {
      ctx.strokeStyle = css("--lane"); ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
      ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(tx, ty); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = css("--lane"); ctx.beginPath(); ctx.arc(tx, ty, 5, 0, Math.PI * 2); ctx.fill();
      ctx.font = `10px ${css("--mono")}`; ctx.fillStyle = css("--sand"); ctx.textAlign = "left";
      ctx.fillText(isGrounded(s) ? "grounded" : GROUNDED.includes(s.structure) ? "on the floor" : `y ${round(+s.from.y || 0, 2)}`, fx + 10, fy + 4);
    }
    // Not in play: faded by how far it is from the playhead - what is coming soon stands out, what has
    // gone fades fast, and anything far off is not drawn (the selection always is).

  });

  if (laneBox) {

    ctx.strokeRect(laneBox.x0, laneBox.y0, laneBox.x1 - laneBox.x0, laneBox.y1 - laneBox.y0); ctx.setLineDash([]);
    ctx.fillStyle = "#ffffff10"; ctx.fillRect(laneBox.x0, laneBox.y0, laneBox.x1 - laneBox.x0, laneBox.y1 - laneBox.y0);
  }
}

/** A structure's footprint, to scale (at least a few pixels): grow pads it, outline strokes instead of filling. */
function footprint(structure, grow = 0) {

function actorSpotAt(actor, t) {
  let at = actor.at || { x: 0, z: lane().length };
  const first = actors()[0].id;
  for (const p of S.chart.phases || []) if (p.at && (p.actor ?? first) === actor.id && phaseTime(p) <= t) at = p.at;
  for (const e of S.chart.events) if (e.at && (e.actor ?? first) === actor.id && evTime(e) <= t) at = e.at;

laneCanvas.addEventListener("pointerdown", ev => {
  if (!laneMap) return;

  // Grab the selected projectile's origin or aim point.
  for (const i of S.selection) {
    const s = S.chart.events[i]?.projectile; if (!s) continue;
    const [fx, fy] = laneMap.toPx(+s.from.x || 0, +s.from.z || 0);
    if (Math.hypot(px - fx, py - fy) < 14) { laneDrag = { index: i, part: "from", before: S.text }; laneCanvas.setPointerCapture(ev.pointerId); return; }

laneCanvas.addEventListener("pointermove", ev => {

laneCanvas.addEventListener("pointerup", () => {

// ---- Timeline canvas --------------------------------------------------------------------------
const tl = $("timeline"), tctx = tl.getContext("2d");
const ROWS = { ruler: [0, 22], wave: [22, 58], phase: [80, 22], shot: [102, 46], move: [148, 34], take: [182, 30] };
let tlDrag = null, peaks = null;
/** The box being dragged on the lane view to select projectiles, or null. */
let laneBox = null;

const xOf = t => (t - S.view.t0) * S.view.pps;
const tOf = x => x / S.view.pps + S.view.t0;

function snapTime(t) {
  const tp = tempo();
  if (!S.snap || !tp.ok) return round(t, 3);
  return round(tp.seconds(Math.round(tp.beat(t) / S.snap) * S.snap), 4);
}

function drawTimeline() {
  const { w, h, dpr } = sizeCanvas(tl);
  const ctx = tctx; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#171a1f"; ctx.fillRect(0, 0, w, h);
  const t0 = S.view.t0, t1 = tOf(w), tp = tempo();
  ctx.font = `10px ${css("--mono")}`;

  // Beats and bars, else seconds.
  if (tp.ok) {
    const b0 = Math.floor(tp.beat(Math.max(0, t0))), b1 = Math.ceil(tp.beat(Math.max(0, t1)));
    const sub = S.snap && S.view.pps * 60 / tp.bpmAt(Math.max(0, t0)) * S.snap > 10 ? S.snap : 1;
    for (let b = b0; b <= b1; b += sub) {
      const x = xOf(tp.seconds(b)), bar = b % 4 === 0, whole = Number.isInteger(b);
      ctx.fillStyle = bar ? "#3a414d" : whole ? "#2a3039" : "#22272e";
      ctx.fillRect(x, ROWS.ruler[1], 1, h - ROWS.ruler[1]);
      if (bar) { ctx.fillStyle = css("--dust"); ctx.textAlign = "left"; ctx.fillText(`${b / 4 + 1}`, x + 3, 14); }
    }
  } else {
    for (let s = Math.max(0, Math.floor(t0)); s <= t1; s++) {
      const x = xOf(s); ctx.fillStyle = "#2a3039"; ctx.fillRect(x, ROWS.ruler[1], 1, h);
      ctx.fillStyle = css("--dust"); ctx.textAlign = "left"; ctx.fillText(`${s}s`, x + 3, 14);
    }
  }
  // Tempo changes.
  if (Array.isArray(S.chart.bpm)) tp.changes.forEach(c => { const x = xOf(tp.seconds(c.beat)); ctx.fillStyle = css("--telegraph"); ctx.fillText(`♩${c.bpm}`, x + 3, 14); ctx.fillRect(x, 0, 2, 22); });

  // Song waveform (chart time = song time - music.start).
  drawWave(ctx, w);

  // Row labels and bands.
  ctx.fillStyle = "#ffffff08";
  for (const k of ["phase", "move"]) ctx.fillRect(0, ROWS[k][0], w, ROWS[k][1]);

  // Phases.
  (S.chart.phases || []).forEach((p, i, all) => {
    const a = xOf(phaseTime(p)), b = xOf(i + 1 < all.length ? phaseTime(all[i + 1]) : end());
    ctx.fillStyle = i === S.selectedPhase ? "#4fd1a555" : (i % 2 ? "#4fd1a522" : "#4fd1a533");
    ctx.fillRect(a, ROWS.phase[0] + 2, b - a - 1, ROWS.phase[1] - 4);
    ctx.fillStyle = css("--phase"); ctx.textAlign = "left";
    ctx.fillText(`${p.name || "Phase " + (i + 1)}${p.scoreMultiplier && p.scoreMultiplier !== 1 ? " ×" + p.scoreMultiplier : ""}`, a + 4, ROWS.phase[0] + 15);
  });

  // Events, where markers() put them.
  for (const { i, x, y } of markers()) {
    const e = S.chart.events[i], t = evTime(e), sel = S.selection.has(i);
    if (e.projectile) {
      const s = e.projectile, spawn = t - (s.telegraph ?? 0.5);
      ctx.fillStyle = "#ffd16655"; ctx.fillRect(xOf(spawn), y - 2, x - xOf(spawn), 4);
      ctx.fillStyle = sel ? css("--sand") : css("--lane");
      ctx.beginPath(); ctx.moveTo(x, y - 7); ctx.lineTo(x + 6, y); ctx.lineTo(x, y + 7); ctx.lineTo(x - 6, y); ctx.fill();
      if (sel) { ctx.strokeStyle = css("--lane"); ctx.lineWidth = 2; ctx.stroke(); }
    } else {
      ctx.fillStyle = sel ? css("--sand") : (e.at ? css("--phase") : e.clip != null ? css("--take") : css("--move"));
      if (e.at) ctx.fillRect(x - 5, y - 5, 10, 10);
      else { ctx.beginPath(); ctx.moveTo(x - 6, y + 6); ctx.lineTo(x, y - 7); ctx.lineTo(x + 6, y + 6); ctx.fill(); }
      ctx.textAlign = "left"; ctx.fillStyle = css("--dust");
      ctx.fillText(e.move ?? e.clip ?? `→ ${e.at.x}, ${e.at.z}`, x + 8, y + 4);
    }
  }

  // The box being dragged to select.
  if (tlDrag?.box) {
    const b = tlDrag.box;
    ctx.strokeStyle = css("--sand"); ctx.lineWidth = 1; ctx.setLineDash([4, 3]);
    ctx.strokeRect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0); ctx.setLineDash([]);
    ctx.fillStyle = "#ffffff10"; ctx.fillRect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0);
  }

  // Recorded takes (made in game - shown, kept, not edited here).
  (S.chart.tracks || []).forEach(track => (track.takes || []).forEach((k, i, all) => {
    const t = k.t ?? (tp.ok && k.beat != null ? tp.seconds(k.beat) : 0);
    const next = i + 1 < all.length ? (all[i + 1].t ?? 0) : null;
    const clip = S.clips.get(k.clip);
    let stop = k.to != null ? t + (k.to - (k.from ?? 0)) : (clip ? t + (clip.end - (k.from ?? 0)) : end());
    if (next != null) stop = Math.min(stop, next);
    ctx.fillStyle = "#b38cff33"; ctx.fillRect(xOf(t), ROWS.take[0] + 4, xOf(stop) - xOf(t) - 1, ROWS.take[1] - 8);
    ctx.fillStyle = css("--take"); ctx.textAlign = "left"; ctx.fillText(k.clip, xOf(t) + 4, ROWS.take[0] + 19);
  }));

  // Row names.
  ctx.fillStyle = css("--dust"); ctx.textAlign = "right"; ctx.font = `600 10px ${css("--body")}`;
  [["PHASES", "phase"], ["PROJECTILES", "shot"], ["MOVES · SPOTS", "move"], ["RECORDED", "take"]].forEach(([n, k]) => ctx.fillText(n, w - 6, ROWS[k][0] + 11));

  // End and playhead.
  ctx.fillStyle = css("--bad"); ctx.fillRect(xOf(end()), ROWS.ruler[1], 2, h);
  ctx.fillStyle = css("--sand"); ctx.fillRect(xOf(S.time), 0, 2, h);
}

function drawWave(ctx, w) {
  const [y0, hh] = ROWS.wave, mid = y0 + hh / 2;
  ctx.fillStyle = "#ffffff06"; ctx.fillRect(0, y0, w, hh);
  if (!S.song?.buffer) {
    ctx.fillStyle = css("--dust"); ctx.textAlign = "left"; ctx.font = `12px ${css("--body")}`;
    ctx.fillText(S.chart.music?.file ? `Open ${S.chart.music.file} to see and hear it` : "No song - add one in the Chart tab, then open the file", 8, mid + 4);
    return;
  }
  const buffer = S.song.buffer, data = peaks ||= buildPeaks(buffer), offset = +(S.chart.music?.start || 0);
  ctx.fillStyle = "#9fb3c8aa";
  for (let x = 0; x < w; x++) {
    const a = tOf(x) + offset, b = tOf(x + 1) + offset;
    if (b < 0 || a > buffer.duration) continue;
    const i0 = Math.max(0, Math.floor(a * data.rate)), i1 = Math.min(data.max.length, Math.ceil(b * data.rate));
    let m = 0; for (let i = i0; i < i1; i++) m = Math.max(m, data.max[i]);
    const hgt = Math.max(1, m * (hh - 4));
    ctx.fillRect(x, mid - hgt / 2, 1, hgt);
  }
}
function buildPeaks(buffer) {
  const rate = 200, ch = buffer.getChannelData(0), step = Math.floor(buffer.sampleRate / rate), max = new Float32Array(Math.ceil(ch.length / step));
  for (let i = 0; i < max.length; i++) { let m = 0; for (let j = i * step, e = Math.min(ch.length, j + step); j < e; j++) m = Math.max(m, Math.abs(ch[j])); max[i] = m; }
  return { rate, max };
}

/**
 * Where each event's marker is drawn on the timeline: projectiles in four rows by where they start
 * across the lane, moves and spots in theirs - and markers that would land on one another (the same
 * time and row) fanned out sideways, so every one can be seen and clicked.
 */
function markers() {
  const out = [], taken = new Map(), lanes = 4, step = 8;
  S.chart.events.forEach((e, i) => {
    const t = evTime(e); if (!Number.isFinite(t)) return;
    let x = xOf(t), y;
    if (e.projectile) {
      const row = Math.min(lanes - 1, Math.max(0, Math.round(((+e.projectile.from?.x || 0) / lane().width + 0.5) * (lanes - 1))));
      y = ROWS.shot[0] + 7 + row * ((ROWS.shot[1] - 14) / (lanes - 1));
    } else {
      y = ROWS.move[0] + ROWS.move[1] / 2;
    }
    const key = `${Math.round(x / 3)}:${y}`, n = taken.get(key) || 0;
    taken.set(key, n + 1);
    out.push({ i, x: x + n * step, y });
  });
  return out;
}

/** The events under a point, nearest first (markers are about 12 px). */
function eventsAt(x, y) {
  return markers().map(m => ({ i: m.i, d: Math.hypot(m.x - x, m.y - y) })).filter(m => m.d <= 9).sort((a, b) => a.d - b.d).map(m => m.i);
}

let lastPick = null;
/** Of the events under a point, the next one along if the same spot was just clicked - so a stack can be stepped through. */
function cycle(under, where, x, y) {
  let pick = under[0];
  if (lastPick && lastPick.where === where && Math.hypot(lastPick.x - x, lastPick.y - y) < 4 && S.selection.size === 1) {
    const at = under.indexOf([...S.selection][0]);
    if (at >= 0) pick = under[(at + 1) % under.length];
  }
  lastPick = { where, x, y };
  return pick;
}

function hitEvent(x, y) {
  const under = eventsAt(x, y);
  return under.length ? cycle(under, "timeline", x, y) : -1;
}

tl.addEventListener("pointerdown", ev => {
  const r = tl.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  tl.setPointerCapture(ev.pointerId);
  if (y < ROWS.phase[0]) { seek(Math.max(0, tOf(x))); tlDrag = { seek: true }; return; }
  if (y < ROWS.phase[0] + ROWS.phase[1]) {
    const t = tOf(x), phases = S.chart.phases || [];
    S.selectedPhase = phases.findIndex((p, i) => phaseTime(p) <= t && (i + 1 >= phases.length || phaseTime(phases[i + 1]) > t));
    S.selection.clear(); S.tab = "chart"; refresh(); return;
  }
  const hit = hitEvent(x, y);
  if (hit >= 0) {
    if (!S.selection.has(hit)) select(hit, ev.shiftKey);
    tlDrag = { start: tOf(x), before: S.text, times: [...S.selection].map(i => [i, evTime(S.chart.events[i])]), moved: false };
    return;
  }
  if (ev.detail === 2 && y >= ROWS.shot[0] && y < ROWS.shot[0] + ROWS.shot[1]) { seek(snapTime(tOf(x))); addProjectile(); return; }
  if (ev.detail === 2 && y >= ROWS.move[0] && y < ROWS.move[0] + ROWS.move[1]) { seek(snapTime(tOf(x))); addMove(); return; }
  // Empty space in the event rows: drag a box to select (shift adds); a click alone still seeks there.
  if (y >= ROWS.shot[0] && y < ROWS.move[0] + ROWS.move[1]) {
    tlDrag = { box: { x0: x, y0: y, x1: x, y1: y }, add: ev.shiftKey, before: new Set(S.selection) };
    return;
  }
  if (!ev.shiftKey) { S.selection.clear(); }
  seek(Math.max(0, tOf(x))); tlDrag = { seek: true };
});
tl.addEventListener("pointermove", ev => {
  if (!tlDrag) return;
  const r = tl.getBoundingClientRect(), x = ev.clientX - r.left;
  if (tlDrag.box) {
    const b = tlDrag.box; b.x1 = x; b.y1 = ev.clientY - r.top;
    const [x0, x1] = [Math.min(b.x0, b.x1), Math.max(b.x0, b.x1)], [y0, y1] = [Math.min(b.y0, b.y1), Math.max(b.y0, b.y1)];
    S.selection = new Set(tlDrag.add ? tlDrag.before : []);
    for (const m of markers()) if (m.x >= x0 && m.x <= x1 && m.y >= y0 && m.y <= y1) S.selection.add(m.i);

    return;
  }
  if (tlDrag.seek) { seek(Math.max(0, tOf(x))); return; }

  if (Math.abs(delta * S.view.pps) < 3 && !tlDrag.moved) return;
  tlDrag.moved = true;

tl.addEventListener("pointerup", () => {

    if (Math.abs(b.x1 - b.x0) < 4 && Math.abs(b.y1 - b.y0) < 4) {

      seek(Math.max(0, tOf(b.x0)));
    }
    tlDrag = null; S.selectedPhase = -1; refresh();

  }

tl.addEventListener("wheel", ev => {

function zoom(factor, atX) {

  S.view.pps = Math.max(8, Math.min(600, S.view.pps * factor));
  S.view.t0 = Math.max(-1, anchor - (atX ?? tl.getBoundingClientRect().width / 2) / S.view.pps);
  drawTimeline();

// ---- Selection, inspector and adding -----------------------------------------------------------
function select(i, add) {
  if (!add) S.selection.clear();
  if (S.selection.has(i) && add) S.selection.delete(i); else S.selection.add(i);
  S.selectedPhase = -1;
  refresh();
}

function addProjectile(at) {

  const base = at || actorSpotAt(first, S.time);
  // Late enough for its warning: a projectile appears its telegraph before it flies.
  const ev = newTimed(Math.max(S.time, 0.2));
  ev.projectile = { structure: "Disc", from: { x: round(base.x, 1), y: 0, z: round(Math.max(0.5, Math.min(L.length, base.z - (at ? 0 : 1))), 1) }, to: "player", speed: 10, telegraph: 0.2, by: first.id };
  insert(ev);
}
function addMove() { const ev = newTimed(S.time); ev.move = "Straight"; insert(ev); }
function addPhase() {
  change(["phases"], () => {
    S.chart.phases ??= [{ name: "Start", start: 0 }];
    const t = snapTime(S.time);
    if (!S.chart.phases.some(p => Math.abs(phaseTime(p) - t) < 0.01)) S.chart.phases.push({ name: `Phase ${S.chart.phases.length + 1}`, start: t });
    S.chart.phases.sort((a, b) => phaseTime(a) - phaseTime(b));

}
function newTimed(t) {

  const snapped = Math.max(0, snapTime(t));
  return useBeats ? { beat: round(tp.beat(snapped), 4) } : { t: round(snapped, 3) };
}
function insert(ev) {

  S.selection = new Set([S.chart.events.indexOf(ev)]);

}

    body = `

          ? `<label><span>Height</span><input disabled value="${isGrounded(s) ? "grounded" : "on the floor"}" title="${isGrounded(s) ? "Grounded: it rests on the floor and is thrown along it" : `${s.structure} comes up out of the ground and rests on it`}"></label>`

$("inspector").addEventListener("change", ev => {
  const i = [...S.selection][0], e = S.chart.events[i]; if (!e) return;
  const v = ev.target.value, n = parseFloat(v), id = ev.target.id;
  change(["events"], () => {
    const s = e.projectile;
    switch (id) {
      case "f_t": e.t = round(Math.max(0, n), 3); break;
      case "f_beat": e.beat = round(Math.max(0, n), 4); break;
      case "f_structure": s.structure = v; break;
      case "f_fx": s.from.x = n; break;
      case "f_fy": case "f_fy_slide": s.from.y = round(Math.max(0, n), 2); break;
      case "f_fz": s.from.z = n; break;
      case "f_aim": s.to = v === "player" ? "player" : { x: 0, y: 1.3 }; break;
      case "f_tx": s.to.x = n; break;
      case "f_ty": s.to.y = n; break;
      case "f_grounded": if (ev.target.checked === GROUNDED_STATE.includes(s.structure)) delete s.grounded; else s.grounded = ev.target.checked; break;
      case "f_speed": s.speed = Math.max(0.5, n); break;
      case "f_tel": s.telegraph = Math.max(0, n); break;
      case "f_by": if (v) s.by = v; else delete s.by; break;
      case "f_move": e.move = v; break;
      case "f_actor": if (v === actors()[0].id) delete e.actor; else e.actor = v; break;
      case "f_ax": e.at.x = n; break;
      case "f_az": e.at.z = n; break;
      case "f_clip": e.clip = v; break;
    }
  });
  S.selection = new Set([S.chart.events.indexOf(e)]);
  refresh();
});
$("inspector").addEventListener("click", ev => {
  const act = ev.target.dataset?.act; if (!act) return;
  if (act === "delete") removeSelected();
  if (act === "copy") copySelected();
  if (act === "mirror") mirrorSelected();
  if (act === "spot") {
    const e = S.chart.events[[...S.selection][0]], at = actorSpotAt(actors().find(a => a.id === e.projectile.by) || actors()[0], evTime(e));
    change(["events"], () => { e.projectile.from.x = at.x; e.projectile.from.z = round(Math.max(0.5, at.z - 1), 1); });

function removeSelected() {
  if (!S.selection.size) return;
  const gone = new Set(S.selection);
  change(["events"], () => { S.chart.events = S.chart.events.filter((_, i) => !gone.has(i)); });
  S.selection.clear(); refresh();
}
function mirrorSelected() {
  const chosen = [...S.selection].map(i => S.chart.events[i]);
  change(["events"], () => chosen.forEach(e => {
    if (e.projectile) { e.projectile.from.x = -(+e.projectile.from.x || 0); if (e.projectile.to && e.projectile.to !== "player") e.projectile.to.x = -(+e.projectile.to.x || 0); }
    if (e.at) e.at.x = -(+e.at.x || 0);
  }));
  S.selection = new Set(chosen.map(e => S.chart.events.indexOf(e))); refresh();
}
let clipboard = null;
function copySelected() {
  const chosen = [...S.selection].map(i => S.chart.events[i]).filter(Boolean);
  if (!chosen.length) return;
  const t0 = Math.min(...chosen.map(evTime));
  clipboard = chosen.map(e => ({ offset: evTime(e) - t0, event: JSON.parse(JSON.stringify(e)) }));
  toast(`Copied ${chosen.length} - Ctrl+V pastes at the playhead`);
}
function paste() {
  if (!clipboard) return;
  const at = snapTime(S.time), made = [];
  change(["events"], () => clipboard.forEach(c => { const e = JSON.parse(JSON.stringify(c.event)); setEvTime(e, at + c.offset); S.chart.events.push(e); made.push(e); }));
  S.selection = new Set(made.map(e => S.chart.events.indexOf(e))); refresh();
}

$("panel").addEventListener("change", ev => {
  const el = ev.target, id = el.id, v = el.value, n = parseFloat(v), c = S.chart;
  if (el.dataset.tempo != null) {
    const i = +el.dataset.tempo, list = Array.isArray(c.bpm) ? c.bpm.map(x => ({ ...x })) : [{ beat: 0, bpm: +c.bpm }];
    list[i][el.dataset.field] = n;
    change(["bpm"], () => { c.bpm = list.length === 1 ? list[0].bpm : list.sort((a, b) => a.beat - b.beat); });
    return;
  }
  if (el.dataset.pcolourOn != null || el.dataset.pcolour != null || ["pw_mode", "pw_colour", "pw_alpha"].includes(id)) {
    change(["phases"], () => {
      const p = c.phases[S.selectedPhase], next = readPhaseColours();
      delete p.colors;
      if (Object.keys(next).length) p.colours = next; else delete p.colours;
    });
    return;
  }
  if (el.dataset.colour != null) {
    change(["colours"], () => { const next = { ...colours(), [el.dataset.colour]: v }; delete c.colors; c.colours = next; });
    return;
  }
  if (el.dataset.actor != null) {
    const i = +el.dataset.actor, field = el.dataset.field;
    change(["actors"], () => {
      c.actors = actors().map(a => ({ ...a, at: { ...(a.at || {}) } }));
      const a = c.actors[i];
      if (field === "x" || field === "z") a.at[field] = n;
      else if (field === "lookPaste") { if (v.trim()) a.look = v.trim(); }
      else if (field === "stone0" || field === "stone1") {
        if (field === "stone0" && v === "you") { delete a.shiftstones; return; }
        const now = Array.isArray(a.shiftstones) ? [...a.shiftstones] : [];
        now[field === "stone0" ? 0 : 1] = v;
        a.shiftstones = now.filter(Boolean).map(s => s.endsWith("Stone") ? s : s + "Stone");
      }
      else a[field] = v;
    });
    return;
  }
  const s = (key, value) => change([key], () => { if (value === undefined || value === "" || (typeof value === "number" && isNaN(value))) delete c[key]; else c[key] = value; });
  switch (id) {
    case "c_name": s("name", v); break;
    case "c_author": s("author", v); break;
    case "c_difficulty": s("difficulty", v); break;
    case "c_description": s("description", v); break;
    case "c_end": s("end", isNaN(n) ? undefined : n); break;
    case "c_cover": s("cover", v.trim() || undefined); break;
    case "c_width": change(["lane"], () => { c.lane = { length: lane().length, width: n }; }); break;
    case "c_length": resizeLane(n); break;
    case "c_map": change(["arena"], () => { c.arena = { map: v }; }); break;
    case "z_length": case "z_height": change(["zone"], () => {
      const length = parseFloat($("z_length").value), height = parseFloat($("z_height").value), z = {};
      if (!isNaN(length)) z.length = length;
      if (!isNaN(height)) z.height = height;
      if (Object.keys(z).length) c.zone = z; else delete c.zone;
    }); break;
    case "w_show": case "w_colour": case "w_alpha": change(["colours"], () => {
      const next = { ...colours() };
      if ($("w_show").checked) next.walls = $("w_colour").value + Math.round(Math.min(1, Math.max(0, parseFloat($("w_alpha").value) || 0.2)) * 255).toString(16).padStart(2, "0");
      else delete next.walls;
      delete S.chart.colors;
      if (Object.keys(next).length) S.chart.colours = next; else delete S.chart.colours;
    }); break;
    case "r_spawn": case "r_cleanup": change(["rules"], () => {
      const rules = { ...(c.rules || {}) }, spawn = $("r_spawn").value, cleanup = parseFloat($("r_cleanup").value);
      if (spawn === "all") delete rules.spawn; else rules.spawn = spawn;
      if (isNaN(cleanup)) delete rules.cleanup; else rules.cleanup = Math.max(0, cleanup);
      if (Object.keys(rules).length) c.rules = rules; else delete c.rules;
    }); break;
    case "c_ax": case "c_az": case "c_facing": change(["arena"], () => {
      const a = { ...(c.arena || { map: "here" }) }, x = parseFloat($("c_ax").value), z = parseFloat($("c_az").value), f = parseFloat($("c_facing").value);
      if (!isNaN(x) && !isNaN(z)) a.at = { x, z }; else delete a.at;
      if (!isNaN(f)) a.facing = f; else delete a.facing;
      c.arena = a;
    }); break;
    case "m_file": case "m_start": case "m_volume": change(["music"], () => {
      const file = $("m_file").value.trim();
      if (!file) { delete c.music; return; }
      c.music = { file, start: parseFloat($("m_start").value) || 0, volume: Math.min(1, Math.max(0, parseFloat($("m_volume").value) || 1)) };
    }); peaks = null; break;
    case "p_name": case "p_mult": case "p_start": change(["phases"], () => {
      const p = c.phases[S.selectedPhase];
      p.name = $("p_name").value;
      const mult = parseFloat($("p_mult").value); if (mult && mult !== 1) p.scoreMultiplier = mult; else delete p.scoreMultiplier;
      if (S.selectedPhase > 0) { delete p.startBeat; p.start = Math.max(0, parseFloat($("p_start").value) || 0); }
    }); break;
  }
});
$("panel").addEventListener("click", ev => {

  if (el.id === "tapUse") { const bpm = round(tapBpm(), 1); change(["bpm"], () => { c.bpm = bpm; }); toast(`Tempo set to ${bpm} bpm`); return; }
  if (el.id === "tempoAdd") {
    const tp = tempo();
    change(["bpm"], () => {
      if (!tp.ok) { c.bpm = 120; return; }
      const list = Array.isArray(c.bpm) ? c.bpm.map(x => ({ ...x })) : [{ beat: 0, bpm: +c.bpm }];
      const beat = Math.max(1, Math.round(tp.beat(S.time)));
      if (!list.some(x => x.beat === beat)) list.push({ beat, bpm: tp.bpmAt(S.time) });
      c.bpm = list.sort((a, b) => a.beat - b.beat);
    });
    return;
  }
  if (el.dataset.tempoRemove != null) {
    const i = +el.dataset.tempoRemove;

    return;
  }

    return;
  }

/**
 * A longer or shorter lane takes the chart with it, as the game's lane setup does: every distance
 * along the lane - projectile origins, actor spots and moves, phase spots, your zone - is scaled, so
 * nothing is left past the far end (a chart saved without this would not load).
 */
function resizeLane(length) {
  const c = S.chart, old = lane().length;
  if (!(length > 2) || Math.abs(length - old) < 0.001) return;
  const k = length / old, scale = z => round(Math.min(length, Math.max(0, (+z || 0) * k)), 2);
  change(["lane", "events", "phases", "actors", "zone"].filter(key => key === "lane" || c[key] != null), () => {
    c.lane = { length, width: lane().width };
    for (const e of c.events) {
      if (e.projectile?.from) e.projectile.from.z = scale(e.projectile.from.z);
      if (e.at) e.at.z = scale(e.at.z);
    }
    for (const p of c.phases || []) if (p.at) p.at.z = scale(p.at.z);
    if (Array.isArray(c.actors)) for (const a of c.actors) {
      a.at ??= { x: 0, z: old };
      a.at.z = Math.abs((+a.at.z || 0) - old) < 0.01 ? length : scale(a.at.z);
    }
    if (c.zone?.length != null) c.zone.length = Math.max(0.5, scale(c.zone.length));
  });
  toast(`Lane ${length} m - everything along it moved with it`);
}

function tap() {
  const now = performance.now();
  if (S.tapTimes.length && now - S.tapTimes[S.tapTimes.length - 1] > 2500) S.tapTimes = [];
  S.tapTimes.push(now); if (S.tapTimes.length > 16) S.tapTimes.shift();
  renderPanel();
}
function tapBpm() { const t = S.tapTimes; return t.length < 2 ? 0 : 60000 * (t.length - 1) / (t[t.length - 1] - t[0]); }

// ---- Playback --------------------------------------------------------------------------------
function chartTimeNow() {
  if (!S.playing) return S.time;

  return S.playStartTime + (performance.now() - S.playStartedAt) / 1000 * S.rate;
}
function play() {
  if (S.playing) { pause(); return; }
  ensureAudio();
  S.playing = true; S.playStartTime = S.time; S.playStartedAt = performance.now(); S.lastClickBeat = -1;
  if (S.song) {
    const at = S.time + (+S.chart.music?.start || 0);
    if (at >= 0 && at < (S.song.buffer?.duration ?? Infinity)) { audio.currentTime = at; audio.playbackRate = S.rate; audio.volume = playbackVolume(); audio.play().catch(() => {}); }
  }

  requestAnimationFrame(tick);
}
function pause() { S.time = chartTimeNow(); S.playing = false; audio.pause(); $("btnPlay").textContent = "Play"; refresh(); }
function seek(t) {
  S.time = t;
  if (S.playing) { S.playStartTime = t; S.playStartedAt = performance.now(); if (S.song) audio.currentTime = Math.max(0, t + (+S.chart.music?.start || 0)); }
  drawTimeline(); drawLane(); updateClock();
}
function tick() {
  if (!S.playing) return;
  S.time = chartTimeNow();
  // Start the song when the chart reaches it, if the playhead began before it.
  if (S.song && audio.paused && S.time + (+S.chart.music?.start || 0) >= 0 && S.time + (+S.chart.music?.start || 0) < audio.duration) {
    audio.currentTime = S.time + (+S.chart.music?.start || 0); audio.play().catch(() => {});
  }
  const w = tl.getBoundingClientRect().width;
  if (xOf(S.time) > w * 0.85) S.view.t0 = S.time - (w * 0.2) / S.view.pps;
  if (S.click) clickBeats();
  // To the end of the song when there is one - a chart's "end" can be well before it - else just past the chart's end.
  if (S.time > Math.max(end() + 2, songLength() ?? 0)) pause();

  requestAnimationFrame(tick);
}
function ensureAudio() { try { audioContext ??= new (window.AudioContext || window.webkitAudioContext)(); audioContext.resume?.(); } catch { audioContext = null; } }
function clickBeats() {

  S.lastClickBeat = beat;

  $("clock").innerHTML = `${m}:${s}<small>${tp.ok ? `beat ${round(tp.beat(t) + 1, 2)}` : "no tempo"}</small>`;
}

$("btnOpen").onclick = () => $("fileInput").click();

async function openFiles(entries) {
  try {
    const pack = entries.find(e => /\.(bbchart|zip)$/i.test(e.path));
    if (pack) { await openPackage(new Uint8Array(await pack.file.arrayBuffer()), pack.path); return; }
    const chart = entries.find(e => /(^|\/)chart\.json$/i.test(e.path)) || entries.find(e => /\.json$/i.test(e.path) && !/clips\//i.test(e.path) && !/-take-\d+\.json$/i.test(e.path));
    const others = new Map();
    for (const e of entries) {
      if (e === chart) continue;
      const rel = relative(e.path, chart?.path);
      others.set(rel, new Uint8Array(await e.file.arrayBuffer()));
    }
    if (chart) { load(await chart.file.text(), chart.path.split("/").pop()); clearFiles(); }
    for (const [k, v] of others) S.files.set(k, v);
    await useFiles();
    toast(chart ? `Opened ${S.chart.name || chart.path}${others.size ? ` with ${others.size} file(s)` : ""}` : `Added ${others.size} file(s)`);
  } catch (e) { toast(`Could not open that: ${e.message}`); }
}
/** A file's path relative to the chart's folder, so "clips/x.json" stays "clips/x.json". */
function relative(path, chartPath) {
  const parts = path.split("/"), base = chartPath ? chartPath.split("/").slice(0, -1) : [];
  let i = 0; while (i < base.length && parts[i] === base[i]) i++;
  const rel = parts.slice(i).join("/");
  return /clips\//i.test(rel) || !/\.json$/i.test(rel) ? rel : (/-take-\d+\.json$|clip/i.test(rel) ? `clips/${parts[parts.length - 1]}` : rel);
}
function clearFiles() { S.files = new Map(); S.clips = new Map(); S.song = null; S.cover = null; peaks = null; audio.removeAttribute("src"); }

async function useFiles() {
  // The song the chart names (or any song, if it names none yet).
  const songName = S.chart.music?.file;
  const songKey = [...S.files.keys()].find(k => songName ? k.toLowerCase() === songName.toLowerCase() || k.split("/").pop().toLowerCase() === songName.toLowerCase() : /\.(wav|ogg|mp3)$/i.test(k));
  if (songKey && S.song?.name !== songKey) {
    const bytes = S.files.get(songKey), blob = new Blob([bytes]);
    if (S.song?.url) URL.revokeObjectURL(S.song.url);
    S.song = { name: songKey, url: URL.createObjectURL(blob), buffer: null };
    audio.src = S.song.url;
    try { ensureAudio(); S.song.buffer = await (audioContext || new OfflineAudioContext(1, 1, 44100)).decodeAudioData(bytes.slice().buffer); peaks = null; }
    catch { toast(`${songKey} could not be decoded for the waveform - it still plays if the browser can`); }
    if (!songName) change(["music"], () => { S.chart.music = { file: songKey, start: 0, volume: 1 }; });
  }
  const coverKey = [...S.files.keys()].find(k => S.chart.cover ? k.toLowerCase() === S.chart.cover.toLowerCase() : /\.(png|jpe?g)$/i.test(k));
  if (coverKey) { S.cover = URL.createObjectURL(new Blob([S.files.get(coverKey)])); if (!S.chart.cover) change(["cover"], () => { S.chart.cover = coverKey; }); }
  // Takes: their length, for drawing recorded tracks.
  for (const [k, v] of S.files) {
    if (!/\.json$/i.test(k)) continue;
    try {
      const clip = JSON.parse(new TextDecoder().decode(v)), frames = clip.Frames || clip.frames;
      if (Array.isArray(frames) && frames.length) S.clips.set(clip.Name || clip.name || k.split("/").pop().replace(/\.json$/i, ""), { start: frames[0].T ?? frames[0].t ?? 0, end: frames[frames.length - 1].T ?? frames[frames.length - 1].t ?? 0 });
    } catch { /* not a clip */ }
  }

}

async function openPackage(bytes, name) {
  const files = await Zip.read(bytes);
  let prefix = "";
  if (!files.has("chart.json")) { const nested = [...files.keys()].find(k => /^[^/]+\/chart\.json$/.test(k)); if (!nested) throw new Error("it has no chart.json"); prefix = nested.slice(0, nested.indexOf("/") + 1); }
  load(new TextDecoder().decode(files.get(prefix + "chart.json")), name);
  clearFiles();
  for (const [k, v] of files) if (k !== prefix + "chart.json" && k.startsWith(prefix)) S.files.set(k.slice(prefix.length), v);
  await useFiles();
  toast(`Opened ${name}`);
}

// ---- Zip: read (stored or deflated) and write (stored) -----------------------------------------
const Zip = {
  crcTable: (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })(),

  async read(bytes) {

    if (eocd < 0) throw new Error("it is not a zip");
    let at = view.getUint32(eocd + 16, true);
    const count = view.getUint16(eocd + 10, true);
    if (count > 512) throw new Error("it has more than 512 files");

      const extra = view.getUint16(at + 30, true), comment = view.getUint16(at + 32, true), local = view.getUint32(at + 42, true);
      const name = new TextDecoder().decode(bytes.subarray(at + 46, at + 46 + nameLength)).replace(/\\/g, "/");
      at += 46 + nameLength + extra + comment;
      if (name.endsWith("/") || name.split("/").includes("..") || name.startsWith("/")) continue;
      const dataAt = local + 30 + view.getUint16(local + 26, true) + view.getUint16(local + 28, true);
      const raw = bytes.subarray(dataAt, dataAt + size);

  async inflate(data) {

    const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  },
  write(entries) {
    const parts = [], central = []; let offset = 0;
    for (const [name, data] of entries) {
      const nameBytes = new TextEncoder().encode(name), crc = Zip.crc(data);
      const local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true); local.setUint16(4, 20, true); local.setUint32(14, crc, true);
      local.setUint32(18, data.length, true); local.setUint32(22, data.length, true); local.setUint16(26, nameBytes.length, true);
      const head = new DataView(new ArrayBuffer(46));
      head.setUint32(0, 0x02014b50, true); head.setUint16(4, 20, true); head.setUint16(6, 20, true); head.setUint32(16, crc, true);
      head.setUint32(20, data.length, true); head.setUint32(24, data.length, true); head.setUint16(28, nameBytes.length, true); head.setUint32(42, offset, true);

    endRecord.setUint32(0, 0x06054b50, true); endRecord.setUint16(8, entries.length, true); endRecord.setUint16(10, entries.length, true);

    const all = [...parts, ...central, new Uint8Array(endRecord.buffer)], out = new Uint8Array(all.reduce((s, p) => s + p.length, 0));
    let at = 0; for (const p of all) { out.set(p, at); at += p.length; }
    return out;
  },
};

addEventListener("keydown", ev => {
  if (ev.target.closest?.("input, select, textarea")) return;
  const k = ev.key, ctrl = ev.ctrlKey || ev.metaKey;
  if (k === " ") { ev.preventDefault(); play(); }
  else if (k === "Home") seek(0);
  else if (ctrl && k.toLowerCase() === "z") { ev.preventDefault(); undoRedo(S.undo, S.redo); }
  else if (ctrl && k.toLowerCase() === "y") { ev.preventDefault(); undoRedo(S.redo, S.undo); }
  else if (ctrl && k.toLowerCase() === "c") copySelected();
  else if (ctrl && k.toLowerCase() === "v") paste();
  else if (k === "p" || k === "P") addProjectile();
  else if (k === "m" || k === "M") addMove();
  else if (k === "x" || k === "X") mirrorSelected();
  else if (k === "Delete" || k === "Backspace") removeSelected();
  else if (k === "[") zoom(1 / 1.4);
  else if (k === "]") zoom(1.4);
  else if (k === "ArrowLeft" || k === "ArrowRight") {
    ev.preventDefault();
    const dir = k === "ArrowLeft" ? -1 : 1, tp = tempo(), stepBeats = ev.shiftKey ? 4 : (S.snap || 1);
    const step = t => tp.ok ? tp.seconds(tp.beat(t) + dir * stepBeats) - t : dir * (ev.shiftKey ? 2 : 0.5);
    if (S.selection.size) {
      const chosen = [...S.selection].map(i => S.chart.events[i]);
      change(["events"], () => chosen.forEach(e => setEvTime(e, snapTime(evTime(e) + step(evTime(e))))));
      S.selection = new Set(chosen.map(e => S.chart.events.indexOf(e))); refresh();
    } else seek(Math.max(0, snapTime(S.time + step(S.time))));
  }
});

  let text = SAMPLE, name = "Crossfire (example)";
  try { const d = JSON.parse(localStorage.getItem("bb-editor-draft") || "null"); if (d?.text) { Jsonc.parse(d.text); text = d.text; name = d.name; } } catch { /* the sample */ }
  load(text, name);
  // Fit the timeline again once the page has its real size.
  requestAnimationFrame(() => requestAnimationFrame(() => refresh(true)));
  if (text === SAMPLE) toast("This is an example chart - open your own chart's files, or press New");
})();
</script>
